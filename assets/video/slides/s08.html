*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#0f1418;color:#eef3f6;font-family:Pretendard,sans-serif;
 padding:96px 120px 240px;display:flex;flex-direction:column;justify-content:center;
 gap:44px;overflow:hidden}
body.center{align-items:center;text-align:center}
body.fig{padding:56px 60px 210px;gap:20px}
.k{color:#4fd1a5;font-size:30px;font-weight:600;letter-spacing:.18em}
h1{font-size:88px;font-weight:800;line-height:1.16;letter-spacing:-.025em}
h2{font-size:74px;font-weight:700;line-height:1.22;letter-spacing:-.02em}
.lead{color:#93a4b1;font-size:36px;line-height:1.5;max-width:1400px}
.row{display:flex;gap:26px}
.card{flex:1;background:var(--t);border:1px solid #26313a;border-top:5px solid var(--c);
 border-radius:18px;padding:32px 30px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.card em{font-style:normal;color:#93a4b1;font-size:22px;letter-spacing:.14em}
.card b{display:block;font-size:38px;font-weight:700;color:var(--c);margin:8px 0 10px}
.card span{color:#93a4b1;font-size:25px;line-height:1.45}
.big{background:var(--t);border:1px solid #26313a;border-left:8px solid var(--c);
 border-radius:20px;padding:40px 46px;display:flex;align-items:center;gap:44px}
.big .no{font-size:84px;font-weight:800;color:var(--c);line-height:1;white-space:nowrap}
.big .tx b{display:block;font-size:44px;font-weight:700;margin-bottom:10px}
.big .tx span{color:#93a4b1;font-size:29px;line-height:1.45}
.note{color:#93a4b1;font-size:31px;border-left:5px solid #4fd1a5;padding-left:26px;line-height:1.5}
.term{background:#0a0f13;border:1px solid #26313a;border-radius:18px;padding:34px 40px;
 font-family:'SF Mono',Menlo,monospace;font-size:26px;line-height:1.7;white-space:pre}
.term .g{color:#4fd1a5;font-weight:600} .term .c{color:#93a4b1} .term .r{color:#f0776c}
.stats{display:flex;gap:26px}
.stats>div{flex:1;background:#161d23;border:1px solid #26313a;border-radius:18px;
 padding:34px;text-align:center}
.stats b{display:block;font-size:72px;font-weight:800;color:#4fd1a5;line-height:1.1}
.stats b.warn{color:#e8b04b} .stats b.pb{color:#f0776c}
.stats span{color:#93a4b1;font-size:26px;line-height:1.4}
.tag{display:inline-block;background:#161d23;border:1px solid #26313a;border-radius:999px;
 padding:10px 26px;font-size:26px;color:#93a4b1;margin-right:12px}
.figwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.figwrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;
 background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.src{color:#93a4b1;font-size:24px}
</style></head><body>
      <div class="k">크리틱</div>
