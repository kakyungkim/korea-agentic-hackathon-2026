# 작성자 워크플로 + NAT Guardrails 미들웨어(nvidia-nat-security 1.9.0, `_type: guardrails`).
# configs/author.yml 과 같고 middleware 블록과 workflow.middleware 만 추가됐다.
#
# 문법 출처(설치본): nat/plugins/security/middleware/guardrails/nemo_guardrails_middleware_config.py
#   guardrails | guardrails_root  둘 중 정확히 하나. guardrails_root 는 RailsConfig.from_path 로 읽는 정책 폴더.
#   llm_bindings: {rail 모델 타입: NAT llms 키}. "main"/"default" 는 주 LLM, 그 외는 "<type>_llm" 액션 파라미터로 묶인다.
#   workflow_functions: 가로챌 함수 이름 목록 또는 {함수: {필드: [하위경로]}} 매핑.
#   stream_output_rails: 출력 레일을 토큰 단위로 (Colang 정책에 rails.output.streaming.enabled 필요).
# 부착 방법은 두 가지다. (1) 함수 설정의 `middleware: [이름]` (nat/data_models/function.py FunctionBaseConfig),
# (2) 미들웨어 설정의 workflow_functions / register_workflow_functions 로 자동 발견. 여기서는 (1)을 쓴다.
#
# guardrails_root 는 실행 디렉터리 기준 상대경로이므로 저장소 루트에서 실행한다.
# 실행: .venv/bin/nat validate --config_file configs/guardrails/author_guarded.yml
#       .venv/bin/nat run --config_file configs/guardrails/author_guarded.yml --input "이 약을 제가 하루 두 번 먹어도 될까요?"
#       2026-09-24 실측: 레일이 nvidia/llama-3.1-nemoguard-8b-topic-control 까지 요청을 보내지만 그 모델이 500
#       (서버 쪽 TensorRT-LLM CUDA 오류)을 돌려줘 워크플로가 멈춘다. 차단 시연은 아직 못 했다 [unverified].
#       자세한 내용과 우회 후보는 docs/notes/nat-harness.md 의 "가드레일 미들웨어의 실행 시점 결함 두 가지" 절.

general:
  use_uvloop: true

llms:
  planner:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: true
  worker:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.95
    max_tokens: 1024
    chat_template_kwargs:
      enable_thinking: false

functions:
  echo_tool:
    _type: echo_tool
  prr_calculator:
    _type: prr_calculator
  openfda_faers:
    _type: openfda_faers
    name_field: generic      # 약물명 매칭 필드. brand, medicinalproduct 로 바꿀 수 있다.
    use_cache: true          # 원응답을 eval/results 에 캐시해 분당 240회 제한을 아낀다.
  dailymed_label:
    _type: dailymed_label
    name_type: both
    max_labels: 1            # 라벨 XML 이 커서 상위 1개만 내려받는다.
    use_cache: true
  pubmed_search:
    _type: pubmed_search
    retmax: 5                # 관련도 상위 5편.
    min_interval_seconds: 0.34   # NCBI 키 없이 초당 3회 제한.
    use_cache: true
  diffdock_nim:
    _type: diffdock_nim
    num_poses: 3             # 포즈 3개. 호스팅 상한은 100 이지만 레이트리밋을 아낀다.
    time_divisions: 20
    steps: 18                # 호스팅 필드명은 steps 다. 블루프린트의 num_steps 가 아니다.
    timeout: 900             # NVIDIA 자체 스크립트가 900~1200초를 쓴다.
  vina_reference:
    _type: vina_reference
    use_cache: true          # FDDD 정적 문서라 한 번 받아 캐시하면 다시 받을 일이 없다.
  bindingdb_ref:
    _type: bindingdb_ref
    use_cache: true          # bindingdb.org 직접 호출이 아니라 FDDD 캡처 요약을 읽는다.

middleware:
  topic_guard:
    _type: guardrails
    guardrails_root: configs/guardrails/rails
    # llms 는 LLMRef 라 의존 그래프에 planner 를 먼저 만들라고 알려 준다. 없으면 미들웨어가 먼저 만들어져
    # "LLM `planner` not found" 로 죽는다(실측). llm_bindings 는 평범한 문자열이라 그래프에 안 잡힌다.
    llms: [planner]
    # llm_bindings 로 planner 를 묶으면 NAT 가 돌려주는 객체가 RunnableConfigurableFields 라
    # "must resolve to a LangChain BaseLanguageModel" 로 죽는다(실측, NAT 1.9.0). 레일이 스스로
    # rails/config.yml 의 models 정의(engine nim + NVIDIA_API_KEY)로 모델을 만들게 둔다.
    # llm_bindings:
    #   main: planner
      # topic_control 레일 모델도 NAT llms 로 묶으려면 llms 에 nim 항목(model_name: nvidia/llama-3.1-nemoguard-8b-topic-control)을
      # 만들고 여기 `topic_control: <키>` 를 추가한다. 지금은 rails/config.yml 의 models 정의(engine nim + NVIDIA_API_KEY)를 쓴다.
    stream_output_rails: false

workflow:
  _type: tool_calling_agent
  llm_name: planner
  tool_names: [echo_tool, prr_calculator, openfda_faers, dailymed_label, pubmed_search, diffdock_nim,
               vina_reference, bindingdb_ref]
  middleware: [topic_guard]
  description: "근거 ID 가 붙은 주장과 요약을 JSON 으로 내는 작성자 에이전트 (토픽 제어 레일 부착)"
  verbose: true
  handle_tool_errors: true
  max_iterations: 8
  system_prompt: |
    You are the FlyGate author agent. You trace one compound from structure to human
    evidence. Plan, call tools, then answer.

    Binding tools:
    - vina_reference(target_id, compound_id): pre-computed AutoDock Vina result from the FDDD
      dataset. Returns the score in kcal/mol, the protocol (seed, exhaustiveness, box), SHA256
      digests, and the curator's own `role` text. Evidence IDs look like dock:vina:<sha8>.
    - diffdock_nim(protein_pdb, ligand_smiles, chain): NVIDIA DiffDock NIM. Returns ranked poses
      and position_confidence. Evidence IDs look like dock:diffdock:<sha8>:pose<rank>.
    - bindingdb_ref(target_id): whether an experimental reference affinity set exists for the
      target, with per-endpoint counts. Evidence IDs look like bindingdb:<uniprot>.

    Human evidence tools:
    - openfda_faers(drug, reaction): FAERS report counts and disproportionality metrics. Evidence IDs are openFDA query URLs.
    - dailymed_label(drug_name, reaction): whether the US label already lists the event, and in which section. Evidence IDs are DailyMed setids.
    - pubmed_search(drug, reaction): indexed literature with PMIDs, titles, journals and years. Evidence IDs are PMIDs.
    - prr_calculator(a, b, c, d): PRR, ROR, 95% CIs and chi-square for a 2x2 table you already have.

    Never compute statistics yourself: use prr_calculator and cite its evidence_id.
    Call each retrieval tool at most once per pair; they cache and rate limit themselves.
    When a tool returns errors or no result, report that; never invent counts, PMIDs, setids,
    URLs, scores or SHA256 digests.

    Interpretation limits you must respect. Breaking any of these makes the claim unusable:
    - Docking scores from different targets are not calibrated against each other. Do not rank
      targets, and do not infer selectivity from a score difference.
    - Do not convert a Vina score or a DiffDock position_confidence into Kd, Ki, IC50 or EC50.
    - position_confidence is a pose-plausibility output, not an affinity, and it can be negative.
      A negative value does not show that the compound fails to bind.
    - Cross-docking is exploratory. Repeat the curator's `role` text instead of calling it binding.
    - Ki, Kd, IC50 and EC50 are distinct endpoints. Do not pool them into one affinity.
    - A single seed run, and DiffDock which has no seed at all, cannot support a reproducibility claim.
    - Label, FAERS and literature are compound-level evidence. They cannot confirm binding at a
      specific target.
    - Disproportionality is association, not causation. An event already in the label is a known
      risk rather than a new signal.

    Final answer must be a single JSON object with this shape and nothing else:
    {"claims": [{"text": "...", "evidence_ids": ["..."]}], "summary": "..."}
    Every claim needs at least one evidence_id that came from a tool result. Never cite an ID you
    did not receive from a tool. If you have no evidence, say so in summary and emit no claim.
