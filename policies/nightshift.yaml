# OpenShell 샌드박스 정책: 후보 2 Night Shift (밤새 스스로 실험하는 자율 코딩 에이전트)
#
# base.yaml에 다음을 더했다.
#   - 쓰기 경로 /work/repo (원본 저장소의 "사본". 실험 브랜치는 여기서만 만든다)
#   - 네트워크 pypi.org, files.pythonhosted.org (의존성 설치)
#   - 프로세스 신원 고정(비루트 1500)
#
# ★ github.com을 의도적으로 허용하지 않는다 ★
#   에이전트가 원본 저장소에 push하거나 PR을 여는 일을 "규칙"이 아니라 "구조"로 막기 위해서다.
#   deny-by-default라 목록에 없는 github.com:443은 CONNECT 단계에서 403으로 거부되고
#   `openshell logs nightshift`에 DENIED ... github.com:443 이 남는다. 이 로그가 아침 보고서의
#   "정책 감사 요약"에 들어간다. 패치는 /work/out에 git format-patch로만 내보내고, 적용은
#   사람이 호스트에서 `git am`으로 한다.
#   (pip가 git 소스 sdist를 빌드해야 하는 패키지는 이 정책에서 설치되지 않는다. 의도된 제약.)
#
# 자원 제한(CPU, 메모리, 시간)은 정책 스키마에 없다. 생성과 실행 명령에 건다.
#   openshell sandbox create --name nightshift --from hackathon-sandbox:latest \
#     --policy policies/nightshift.yaml --provider nvidia --cpu 2 --memory 4Gi --detach -- sleep infinity
#   openshell sandbox exec -n nightshift --timeout 3600 -- python3 /sandbox/run_experiment.py
#   (--cpu, --memory는 Docker 드라이버가 런타임 제한으로 적용. docs/sandboxes/manage-sandboxes.mdx)
#   프로세스 개수 상한(pids_limit)은 게이트웨이 설정 파일 쪽 항목이라 여기서는 다루지 않는다. [unverified]

version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /sandbox
  read_write:
    # 저장소 사본. 실험 브랜치, 테스트 실행, 벤치마크가 모두 여기서 일어난다.
    # 원본은 호스트에 있고 샌드박스는 사본만 본다. 사본은 이미지 빌드 시 COPY하거나
    # 샌드박스 생성 전에 이미지 안에 clone해 둔다.
    - /work/repo
    # 아침 보고서, 패치 파일(git format-patch), 크리틱 판정 JSON.
    - /work/out
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

# 이미지(policies/sandbox-image/Dockerfile)가 만든 비루트 사용자 sandbox(1500:1500)로 고정.
# 이미지 USER와 다르게 적으면 /work/repo 소유권이 어긋나 쓰기가 실패하니 함께 바꾼다.
process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  nvidia_inference:
    name: nvidia-inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12
      - path: /sandbox/.venv/**
      - path: /work/.venv/**
      - path: /work/repo/.venv/**

  # PyPI. 공식 예제(examples/local-inference/sandbox-policy.yaml)와 같이 protocol을 생략한
  # L4 통과(호스트와 포트만 검사, 페이로드 미검사)로 둔다. pip는 자체 CA 번들(certifi)을 쓰므로
  # protocol: rest로 TLS를 종단하면 인증서 검증이 실패할 가능성이 있다. [unverified]
  # L7 로그가 꼭 필요하면 protocol: rest, access: read-only, enforcement: enforce로 바꿔 시험한다.
  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
      - host: files.pythonhosted.org
        port: 443
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.12
      - path: /usr/bin/pip3
      - path: /sandbox/.venv/**
      - path: /work/.venv/**
      - path: /work/repo/.venv/**

  # github.com: 없음(위 머리말 참조). 여기에 항목을 추가하지 말 것.
